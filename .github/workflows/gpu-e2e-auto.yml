name: gpu-e2e-auto

on:
  push:
    paths:
      - ".github/gpu-e2e-trigger.txt"

jobs:
  gpu-render:
    name: Real Qwen Image 2.1 NVIDIA render
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show NVIDIA hardware
        shell: bash
        run: |
          echo "GitHub-hosted CPU validation runner"
          free -h
          python --version

      - name: Install CPU PyTorch
        shell: bash
        run: |
          python -m pip install "numpy>=1.26" torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch,torchvision; print('torch=', torch.__version__, 'torchvision=', torchvision.__version__, 'cuda_available=', torch.cuda.is_available())"

      - name: Install minimal MT AI GPU runtime
        shell: bash
        run: |
          python -m pip install -r requirements/gpu-e2e.txt
          python -c "import diffusers,transformers,torchvision; assert hasattr(diffusers, 'QwenImage21Pipeline'); from transformers import Qwen3VLForConditionalGeneration, Qwen3VLProcessor; print('Qwen Image 2.1 runtime imports OK')"

      - name: Validate MT AI pipeline without local GPU render
        shell: bash
        run: |
          python scripts/gpu_e2e.py --output-dir gpu_e2e_artifacts --width 512 --height 288 --steps 4 --memory-profile low-memory --prepare-only --min-fidelity 0

      - name: Print report
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".\gpu_e2e_artifacts\report.json") {
            Get-Content ".\gpu_e2e_artifacts\report.json"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-gpu-e2e-auto-${{ github.sha }}
          path: gpu_e2e_artifacts/
          if-no-files-found: warn
