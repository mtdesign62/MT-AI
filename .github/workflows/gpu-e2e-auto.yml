name: gpu-e2e-auto

on:
  push:
    paths:
      - ".github/gpu-e2e-trigger.txt"

jobs:
  gpu-render:
    name: Real Qwen Image 2.1 NVIDIA render
    runs-on: [self-hosted, Windows, X64, gpu, nvidia]
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      HF_HUB_ENABLE_HF_TRANSFER: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show NVIDIA hardware
        shell: powershell
        run: |
          nvidia-smi
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory

      - name: Install CUDA PyTorch for Blackwell-capable Windows
        shell: powershell
        run: |
          python -m pip install -U pip
          pip install --upgrade torch --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; print('torch=', torch.__version__); print('cuda=', torch.version.cuda); print('gpu=', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'NONE'); print('capability=', torch.cuda.get_device_capability(0) if torch.cuda.is_available() else 'NONE'); assert torch.cuda.is_available(), 'CUDA PyTorch is required'"

      - name: Install MT AI and Qwen runtime dependencies
        shell: powershell
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/ai.txt
          python -c "import diffusers; assert hasattr(diffusers, 'QwenImage21Pipeline'); print('QwenImage21Pipeline=', diffusers.QwenImage21Pipeline)"

      - name: Run real Qwen Image 2.1 edit
        shell: powershell
        run: |
          python scripts/gpu_e2e.py --output-dir gpu_e2e_artifacts --steps 20 --memory-profile low-memory --min-fidelity 0

      - name: Print report
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".\gpu_e2e_artifacts\report.json") {
            Get-Content ".\gpu_e2e_artifacts\report.json"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-gpu-e2e-auto-${{ github.sha }}
          path: gpu_e2e_artifacts/
          if-no-files-found: warn
