name: gpu-e2e-auto

on:
  push:
    paths:
      - ".github/gpu-e2e-trigger.txt"

jobs:
  gpu-render:
    name: Real Qwen Image 2.1 NVIDIA render
    runs-on: [self-hosted, Windows, X64, gpu, nvidia]
    timeout-minutes: 240
    env:
      PYTHONPATH: .
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show NVIDIA hardware
        shell: powershell
        run: |
          nvidia-smi
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory

      - name: Reuse or install CUDA PyTorch
        shell: powershell
        run: |
          python -m pip install "numpy>=1.26"
          python -c "import torch,sys; print('torch=', torch.__version__); print('cuda=', torch.version.cuda); print('cuda_available=', torch.cuda.is_available()); sys.exit(0 if torch.cuda.is_available() else 1)"
          if ($LASTEXITCODE -ne 0) {
            python -m pip install torch --index-url https://download.pytorch.org/whl/cu128
          }
          python -c "import torch; print('gpu=', torch.cuda.get_device_name(0)); print('capability=', torch.cuda.get_device_capability(0)); assert torch.cuda.is_available()"

      - name: Install minimal MT AI GPU runtime
        shell: powershell
        run: |
          python -m pip install -r requirements/gpu-e2e.txt
          python -m pip install --upgrade --force-reinstall --no-deps --pre torchvision --index-url https://download.pytorch.org/whl/nightly/cu128
          python -c "import torch,torchvision; print('torch=', torch.__version__, 'torchvision=', torchvision.__version__); print('torchvision_nms=', hasattr(torch.ops.torchvision, 'nms'))"
          python -c "import diffusers; assert hasattr(diffusers, 'QwenImage21Pipeline'); print('QwenImage21Pipeline=', diffusers.QwenImage21Pipeline)"

      - name: Run real Qwen Image 2.1 edit
        shell: powershell
        run: |
          python scripts/gpu_e2e.py --output-dir gpu_e2e_artifacts --steps 20 --memory-profile low-memory --min-fidelity 0

      - name: Print report
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".\gpu_e2e_artifacts\report.json") {
            Get-Content ".\gpu_e2e_artifacts\report.json"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-gpu-e2e-auto-${{ github.sha }}
          path: gpu_e2e_artifacts/
          if-no-files-found: warn
