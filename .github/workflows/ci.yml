name: windows-smoke-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install core, GUI and test dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Compile Python package
        run: python -m compileall -q mt_ai

      - name: Run unit, integration and GUI smoke tests
        run: pytest -q

      - name: Run CLI diagnostics
        run: python -m mt_ai.cli diagnostics

      - name: Verify application entrypoint imports
        run: |
          python -c "from mt_ai.app import main; from mt_ai.ui.main_window import MainWindow; print('MT AI GUI imports OK')"

  qwen-api-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install AI runtime dependencies
        run: |
          pip install packaging huggingface-hub
          pip install -r requirements/ai.txt

      - name: Verify Qwen Image 2.1 Diffusers pipeline is available
        run: |
          python -c "import diffusers; print('diffusers', diffusers.__version__); assert hasattr(diffusers, 'QwenImage21Pipeline'), 'QwenImage21Pipeline missing from installed Diffusers'; print('QwenImage21Pipeline available')"

      - name: Verify official Qwen Image 2.1 model metadata
        run: |
          python -c "import json; from pathlib import Path; from huggingface_hub import hf_hub_download; p=hf_hub_download('Qwen/Qwen-Image-2.1', 'model_index.json'); d=json.loads(Path(p).read_text(encoding='utf-8')); print('remote pipeline:', d.get('_class_name')); assert d.get('_class_name') == 'QwenImage21Pipeline'"

      - name: Verify MT AI compatibility preflight
        run: |
          python -c "from mt_ai.models.provider import HuggingFaceQwenProvider; state, reason = HuggingFaceQwenProvider._compatibility('QwenImage21Pipeline'); print(state, reason); assert state == 'compatible'"

  full-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install complete MT AI build environment
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/ai.txt
          pip install -r requirements/dev.txt

      - name: Verify source AI self-test
        run: python -m mt_ai.app --self-test-ai

      - name: Build full Windows executable with AI runtime
        run: pyinstaller --clean --noconfirm installer\MT-AI.spec

      - name: Verify frozen executable contains Qwen runtime
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\MT-AI.exe")) {
            throw "MT-AI.exe was not created"
          }
          Remove-Item ".\mt_ai_ai_self_test_report.txt" -ErrorAction SilentlyContinue
          $probe = Start-Process -FilePath ".\dist\MT-AI.exe" -ArgumentList "--self-test-ai" -Wait -PassThru
          if (Test-Path ".\mt_ai_ai_self_test_report.txt") {
            Write-Host "----- frozen self-test report -----"
            Get-Content ".\mt_ai_ai_self_test_report.txt"
            Write-Host "-----------------------------------"
          }
          if ($probe.ExitCode -ne 0) {
            throw "Frozen AI runtime self-test failed with exit code $($probe.ExitCode)"
          }
          Write-Host "Frozen Qwen runtime self-test passed"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MT-AI-v0.2.0-Windows-Bilingual
          path: |
            dist/MT-AI-EN.exe
            dist/MT-AI-VI.exe
          if-no-files-found: error
          retention-days: 30

      - name: Smoke launch full packaged GUI
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\MT-AI.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            throw "Full MT-AI.exe exited unexpectedly with code $($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Full packaged MT-AI.exe GUI launch smoke passed"


  release-v0-2-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-smoke, qwen-api-smoke, full-package-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Download bilingual Windows build
        uses: actions/download-artifact@v4
        with:
          name: MT-AI-v0.2.0-Windows-Bilingual
          path: release

      - name: Publish GitHub Release v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.2.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v0.2.0 already exists"
            exit 0
          fi
          gh release create v0.2.0 release/*.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MT AI v0.2.0 — English + Tiếng Việt" \
            --notes "Windows bilingual release of MT AI.

          Included:
          - MT-AI-EN.exe — English interface
          - MT-AI-VI.exe — giao diện Tiếng Việt
          - Local Qwen Image 2.1 rendering runtime
          - Interior, Architecture, Landscape and Masterplan workflows
          - Render progress, Cancel and Retry controls
          - Draft, Standard, High and Ultra quality presets
          - Model Manager and structural-fidelity workflow

          Model weights are distributed separately and are not bundled into the executable."
