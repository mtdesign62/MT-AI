name: windows-smoke-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install core, GUI and test dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt

      - name: Compile Python package
        run: python -m compileall -q mt_ai

      - name: Run unit, integration and GUI smoke tests
        run: pytest -q

      - name: Run CLI diagnostics
        run: python -m mt_ai.cli diagnostics

      - name: Verify application entrypoint imports
        run: |
          python -c "from mt_ai.app import main; from mt_ai.ui.main_window import MainWindow; print('MT AI GUI imports OK')"
